<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Agenda de Consultas</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-pink: #f9a8d4;
    }

    body {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0b3c49, #6d0056, #0b3c49);
      background-size: 300% 300%;
      animation: fundoAnimado 12s ease infinite;
      color: #cfd4e0;
    }

    @keyframes fundoAnimado {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      position: relative;
      padding: 4rem 0 3.5rem; 
      overflow: hidden;
      background: linear-gradient(
        135deg,
        #2a0a46,
        #5c0f72,
        #2a0a46
      );
    }

    .header::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -10%;
      width: 120%;
      height: 160%;

      background: radial-gradient(
        circle at center,
        rgba(100, 0, 95, 0.644),
        rgba(87, 1, 65, 0.453),
        rgba(20, 0, 40, 0.15),
        transparent
      );

      animation: pulseRoxo 12s ease-in-out infinite alternate;
      filter: blur(50px);
      z-index: 0; 
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;

      background: var(--accent-pink);
      
      background-size: 200% 100%;
      opacity: 0.45; 
    }

    .header * {
      position: relative;
      z-index: 1;
    }

    @keyframes pulseRoxo {
      0% {
        transform: scale(1) translateY(0px);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.15) translateY(-10px);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.05) translateY(5px);
        opacity: 0.45;
      }
    }

    .header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: 800;
      color: #e2e6f2;  /* azul bem claro */
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .header p {
      margin-top: 10px;
      color: #9ca3b8;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      margin-top: 40px;
    }

    .card {
      background: rgba(15, 4, 40, 0.75);          
      border-radius: 16px;
      padding: 1.7rem 2rem;
      margin-bottom: 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);

      color: #cfd4e0;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent-pink);;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem 1rem;
      align-items: center;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-pink);;
    }

    input, textarea, select {
      font: inherit;
      padding: 0.45rem 0.6rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-sizing: border-box;

      background: rgba(5, 8, 20, 0.85); 
      color: #e3e6f2;                    
    }

    input::placeholder,
    textarea::placeholder {
      color: #e89cc7;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #f9a8d4;
      box-shadow: 0 0 0 2px rgba(249, 168, 212, 0.35);
    }

    textarea {
      grid-column: 1 / 3;
      resize: vertical;
      min-height: 60px;
    }

    .form-actions {
      grid-column: 1 / 3;
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0.45rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;

      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    /* primário – Agendar */
    .btn-primary {
      position: relative;
      background-color: #3a0057;
      color: #f3e8ff;
      overflow: hidden;
    }

    .btn-primary::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 250%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(249, 168, 212, 0.6),
        transparent
      );
      animation: slideGlow 12s infinite linear;
    }

    @keyframes slideGlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }
    .btn-primary:hover {
      background-color: #540043;
    }

    /* secundário – Limpar, Atualizar lista */
    .btn-secondary {
      background-color: #e5e7eb;
      color: #111827;
    }

    .btn-secondary:hover {
      background-color: #d1d5db;
    }

    /* perigo – Excluir */
    .btn-danger {
      background-color: #b91c1c;
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    button {
      font: inherit;
    }

    .table-wrapper {
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(10, 5, 30, 0.65);
      backdrop-filter: blur(6px);
      color: #dcd7e6; 
      font-size: 0.95rem;
    }

    th {
      background: rgba(255, 255, 255, 0.08);
      color: #bfa3c8; 
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.03);
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .empty {
      padding: 0.5rem 0;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .badge-error {
      display: inline-block;
      padding: 0.2rem 0.4rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background-color: #fee2e2;
      color: #b91c1c;
      margin-left: 0.25rem;
    }

    .msg {
      font-size: 0.9rem;
      color: var(--accent-pink);
    }

    .msg.error {
      color: #b91c1c;
    }

    .msg.success {
      color: #15803d;
    }
  </style>
</head>
<body>
  
  <header class="header">
    <div class="header-inner container">
      <h1>Clínica Synapse</h1>
      <p>Cuidando das conexões que importam</p>
    </div>
  </header>

  <div class="container">
    <!-- Card de cadastro -->
    <section class="card">
      <h2>Agendar nova consulta</h2>
      <form id="form-consulta">
        <div>
          <label for="data">Data</label>
          <input type="date" id="data" name="data" required />
        </div>

        <div>
          <label for="hora_inicio">Horário de início</label>
          <input type="time" id="hora_inicio" name="hora_inicio" required />
        </div>

        <div>
          <label for="hora_final">Horário de término</label>
          <input type="time" id="hora_final" name="hora_final" required />
        </div>

        <textarea id="descricao" name="descricao" placeholder="Descrição da consulta" required></textarea>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-limpar">
            Limpar
          </button>
          <button type="submit" class="btn btn-primary">
            Agendar
          </button>
        </div>
      </form>
      <div id="mensagem-form" class="msg"></div>
    </section>

    <!-- Card de listagem -->
    <section class="card">
      <h2>Consultas agendadas</h2>
      <button id="btn-atualizar" class="btn btn-secondary" style="margin-bottom: 0.5rem;">
        Atualizar lista
      </button>

      <div id="lista-vazia" class="empty" style="display: none;">
        Nenhuma consulta cadastrada.
      </div>

      <div class="table-wrapper">
        <table id="tabela-consultas" style="display: none;">
          <thead>
            <tr>
              <th>ID</th>
              <th>Data</th>
              <th>Início</th>
              <th>Término</th>
              <th>Descrição</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- linhas geradas via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const tabela = document.getElementById("tabela-consultas");
    const tbody = tabela.querySelector("tbody");
    const listaVazia = document.getElementById("lista-vazia");
    const msgForm = document.getElementById("mensagem-form");

    const API_BASE = "http://localhost:3000";

    function formatarData(date) {
      return date.toLocaleDateString("pt-BR", { timeZone: "UTC" });
    }

    function formatarHora(date) {
      return date.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "UTC"
      });
    }

    async function carregarConsultas() {
      const resp = await fetch(`${API_BASE}/appointments`);
      const consultas = await resp.json();

      tbody.innerHTML = "";

      if (consultas.length === 0) {
        tabela.style.display = "none";
        listaVazia.style.display = "block";
        return;
      }

      tabela.style.display = "table";
      listaVazia.style.display = "none";

      for (const c of consultas) {
        const tr = document.createElement("tr");

        const dtInicio = new Date(c.hora_inicio);
        const dtFim = new Date(c.hora_final);

        tr.innerHTML = `
          <td>${c.id}</td>
          <td>${formatarData(dtInicio)}</td>
          <td>${formatarHora(dtInicio)}</td>
          <td>${formatarHora(dtFim)}</td>
          <td>${c.descricao}</td>
          <td>
            <button data-id="${c.id}" class="btn btn-danger btn-excluir">
              Excluir
            </button>
          </td>
        `;

        tbody.appendChild(tr);
      }

      document.querySelectorAll(".btn-excluir").forEach(btn => {
        btn.addEventListener("click", async (ev) => {
          const id = ev.target.getAttribute("data-id");
          await fetch(`${API_BASE}/appointments/${id}`, {
            method: "DELETE"
          });
          carregarConsultas();
        });
      });
    }

    document.getElementById("form-consulta")?.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = document.getElementById("data").value;
      const horaInicio = document.getElementById("hora_inicio").value;
      const horaFinal = document.getElementById("hora_final").value;
      const descricao = document.getElementById("descricao").value;

      if (!data || !horaInicio || !horaFinal || !descricao) {
        msgForm.textContent = "Preencha todos os campos.";
        msgForm.className = "msg error";
        return;
      }

      const [ano, mes, dia] = data.split("-");
      const dataFormatoAPI = `${dia}/${mes}/${ano}`;

      try {
        const resp = await fetch(`${API_BASE}/appointments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            data: dataFormatoAPI,
            horaInicio,
            horaFinal,
            descricao
          })
        });

        if (resp.status === 409) {
          msgForm.textContent = "Conflito: já existe uma consulta nesse horário.";
          msgForm.className = "msg error";
          return;
        }

        if (!resp.ok) {
          msgForm.textContent = "Erro ao agendar consulta.";
          msgForm.className = "msg error";
          return;
        }

        msgForm.textContent = "Consulta agendada com sucesso!";
        msgForm.className = "msg success";

        document.getElementById("form-consulta").reset();
        carregarConsultas();
      } catch (e) {
        console.error(e);
        msgForm.textContent = "Erro ao comunicar com o servidor.";
        msgForm.className = "msg error";
      }
    });

    document.getElementById("btn-atualizar").addEventListener("click", carregarConsultas);

    carregarConsultas();
  </script>
</body>
</html>
